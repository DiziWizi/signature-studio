name: check-and-release

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Syntax checks
        run: |
          node --version
          for f in assets/js/*.js; do node --check "$f" || exit 1; done
          for f in tests/*.js; do node --check "$f" || exit 1; done
          python3 -m py_compile tools/publish_release.py

      - name: Static smoke test
        run: |
          python3 -m http.server 8899 >/tmp/http.log 2>&1 &
          SRV=$!
          sleep 1
          curl -sf http://127.0.0.1:8899/ | grep -q 'Signature Studio'
          curl -sf http://127.0.0.1:8899/assets/styles.css > /dev/null
          for f in assets/js/*.js; do curl -sf "http://127.0.0.1:8899/$f" > /dev/null || exit 1; done
          kill $SRV

      - name: Build release archive (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          tar --exclude='./.git' --exclude='./dist' -czf "dist/signature-studio-$V.tar.gz" .
          python3 - <<'EOF'
          import zipfile, os
          v = os.environ["GITHUB_REF_NAME"][1:]
          out = f"dist/signature-studio-{v}.zip"
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk("."):
                  dirs[:] = [d for d in dirs if d not in (".git", "dist")]
                  for f in files:
                      p = os.path.join(root, f)
                      z.write(p, p)
          print("wrote", out)
          EOF
          ls -la dist

      - name: Publish release (tags only, token-gated)
        if: startsWith(github.ref, 'refs/tags/v') && secrets.RELEASE_TOKEN != ''
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: python3 tools/publish_release.py --tag "$GITHUB_REF_NAME" --files $(ls dist | sed 's|^|dist/|' | tr '\n' ' ')

  e2e:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        run: npx playwright test
