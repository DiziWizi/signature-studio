name: container-image

# Forgejo stays canonical: this workflow only turns a mirrored tag into a
# GHCR image. It never creates GitHub releases or edits source.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  ghcr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Bowerbird Signature Builder
            org.opencontainers.image.description=Offline HTML email signature builder
            org.opencontainers.image.licenses=MIT

      # Build one architecture locally, prove it serves the app and enforces
      # the header/deny policy, then build the multi-arch image for GHCR.
      - name: Build amd64 for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          IMAGE="$(printf '%s\n' "$TAGS" | head -n 1)"
          docker run -d --name sigstudio-smoke -p 8088:80 "$IMAGE"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8088/ -o /tmp/index.html; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1
          grep -q 'Bowerbird' /tmp/index.html
          curl -fsS http://127.0.0.1:8088/assets/styles.css > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/e2e/)" = 404
          curl -sI http://127.0.0.1:8088/ | grep -qi '^x-content-type-options: nosniff'
          docker rm -f sigstudio-smoke

      - name: Build and push multi-arch
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "### Container pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$TAGS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
