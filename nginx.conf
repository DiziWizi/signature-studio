server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    # Security headers. The CSP is the minimum this app actually needs:
    #  - style-src 'unsafe-inline': the editor sets inline style attributes
    #    (theme colours, widths) — a hash/nonce cannot cover them.
    #  - script-src 'unsafe-inline': the live preview injects a tiny
    #    click-reporter script into an about:srcdoc frame; without
    #    'unsafe-inline' click-to-edit silently stops working.
    # Everything else stays locked to 'self'; images may be hosted or data:.
    # See README → Hardening before tightening this.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cache-Control "no-cache" always;

    # The image only contains the app, but belt and braces for anyone who
    # bind-mounts a checkout into the container.
    location ~ ^/(e2e|docs|tools|tests|\.forgejo|test-results)/ { return 404; }
    location ~ /\. { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
